          - link "See how it works" [ref=f18e34] [cursor=pointer]:
            - /url: "#how"
      - list [ref=f18e36]:
        - listitem [ref=f18e37]: Runs on your machine
        - listitem [ref=f18e38]: Your own CSV files
        - listitem [ref=f18e39]: No marketplace connection
        - listitem [ref=f18e40]: Illustrative demo assumptions
        - listitem [ref=f18e41]: Contribution, not accounting profit
    - generic [ref=f18e43]:
      - generic [ref=f18e44]:
        - paragraph [ref=f18e45]: The problem
        - heading "The shelf price lies." [level=2] [ref=f18e46]
        - paragraph [ref=f18e47]: Subtract what a product cost from what it sells for and the difference looks like profit. Between those two numbers sit four deductions that a spreadsheet column rarely captures, and they are paid on units that never earned anything.
      - list [ref=f18e48]:
        - listitem [ref=f18e49]:
          - text: "01"
          - heading "Marketplace fees" [level=3] [ref=f18e50]
          - paragraph [ref=f18e51]: A share of the price the customer paid, plus a fixed closing and shipping charge per unit. A returned order was still processed, so those fixed charges are paid on it all the same.
        - listitem [ref=f18e52]:
          - text: "02"
          - heading "GST on fees" [level=3] [ref=f18e53]
          - paragraph [ref=f18e54]: A tax on the marketplace’s services, not on your goods. It is still a cost unless you can claim it back as input credit.
        - listitem [ref=f18e55]:
          - text: "03"
          - heading "Returns" [level=3] [ref=f18e56]
          - paragraph [ref=f18e57]: The revenue leaves with the unit. What was spent getting that unit out, and getting it back, stays.
        - listitem [ref=f18e58]:
          - text: "04"
          - heading "Ad spend" [level=3] [ref=f18e59]
          - paragraph [ref=f18e60]: Advertising sits on top of the fees and is paid whether or not the unit sells through. It rarely appears in the column that shows what a product sold for.
      - paragraph [ref=f18e61]: A product that looks comfortably profitable on a spreadsheet can lose money on every unit that ships. Making that visible — per SKU, with the assumptions in the open — is the whole point of this tool.
    - generic [ref=f18e63]:
      - generic [ref=f18e64]:
        - paragraph [ref=f18e65]: How it works
        - heading "Four steps, no setup." [level=2] [ref=f18e66]
      - list [ref=f18e67]:
        - listitem [ref=f18e68]:
          - text: "01"
          - heading "Import your CSVs" [level=3] [ref=f18e69]
          - paragraph [ref=f18e70]: Two CSV files with documented columns — a catalogue and a transaction export — or the built-in synthetic sample. Files are read as text, capped at 5 MB and 20,000 data rows each, and a dry run validates without saving anything.
        - listitem [ref=f18e71]:
          - text: "02"
          - heading "Set your assumptions" [level=3] [ref=f18e72]
          - paragraph [ref=f18e73]: Referral, closing, shipping and fulfilment fees, the GST rate on those fees, refunds and sell-through are one editable, dated set shown next to every derived figure. Change a value and the figures move with it.
        - listitem [ref=f18e74]:
          - text: "03"
          - heading "Read the profit" [level=3] [ref=f18e75]
          - paragraph [ref=f18e76]: Open any SKU to see the lines behind its headline contribution figure, and that those lines sum back to it. Contribution is net revenue less product cost, fees, GST on fees, advertising and other charges, in that order.
        - listitem [ref=f18e77]:
          - text: "04"
          - heading "Spend a budget" [level=3] [ref=f18e78]
          - paragraph [ref=f18e79]: Enter a budget and compare two rules of thumb for splitting it across the catalogue, alongside a conservative scenario that lowers price and sell-through.
    - generic [ref=f18e81]:
      - generic [ref=f18e84]:
        - paragraph [ref=f18e85]: Interactive calculator
        - heading "Live SKU Contribution Simulator" [level=2] [ref=f18e86]
        - paragraph [ref=f18e87]: Stress-test single-unit economics. Referral fees, the loss a return leaves behind and the ad budget each eat into the shelf price, and every change re-runs the calculation on the local backend. Nothing is calculated in your browser.
      - alert [ref=f18e88]:
        - paragraph [ref=f18e89]: The server answered with status 500.
        - button "Try again" [ref=f18e90] [cursor=pointer]
    - generic [ref=f18e92]:
      - generic [ref=f18e93]:
        - paragraph [ref=f18e94]: What it computes
        - heading "Six figures, every one traceable." [level=2] [ref=f18e95]
        - paragraph [ref=f18e96]: All of it realised from the rows you imported. Nothing on this page is projected or inferred, and contribution stops before overheads and income tax — it is not the money that reaches a bank account.
      - generic [ref=f18e97]:
        - generic [ref=f18e98]:
          - term [ref=f18e99]: Gross revenue
          - definition [ref=f18e100]: What the customer paid, GST included. The figure a marketplace reports first, and the one that is easiest to mistake for money you earned.
        - generic [ref=f18e101]:
          - term [ref=f18e102]: Net revenue
          - definition [ref=f18e103]: Gross revenue with GST removed — it was collected on the government’s behalf — and the refunds on returned units taken off.
        - generic [ref=f18e104]:
          - term [ref=f18e105]: Fees
          - definition [ref=f18e106]: Referral, closing, shipping and fulfilment, each on its own line rather than as one lump deduction.
        - generic [ref=f18e107]:
          - term [ref=f18e108]: Fee GST
          - definition [ref=f18e109]: The tax charged on those marketplace fees. A cost of selling unless it comes back as input credit.
        - generic [ref=f18e110]:
          - term [ref=f18e111]: Product cost
          - definition [ref=f18e112]: "What the stock cost you landed: supplier price plus inbound freight and packaging, per unit."
        - generic [ref=f18e113]:
          - term [ref=f18e114]: Contribution
          - definition [ref=f18e115]: Net revenue less product cost, fees, fee GST, advertising and other charges. The headline figure for a SKU, and the one this page and the app both stop at.
    - generic [ref=f18e117]:
      - generic [ref=f18e118]:
        - paragraph [ref=f18e119]: Budget Lab
        - heading "Two plans, both honest." [level=2] [ref=f18e120]
        - paragraph [ref=f18e121]: "Enter a budget — ₹50,000 by default — and the lab splits it two ways. Both rest on a sell-through and a salvage value you can see and change, and neither is presented as the answer: they are two rules of thumb with the same score and one different rule."
      - generic [ref=f18e122]:
        - generic [ref=f18e123]:
          - heading "Plan A — ROI-first" [level=3] [ref=f18e124]
          - paragraph [ref=f18e125]: Ranks every SKU by its risk-adjusted contribution per rupee of stock, then buys down the list until the budget runs out. No cap on how much any single SKU may take.
        - generic [ref=f18e126]:
          - heading "Plan B — Diversified cap" [level=3] [ref=f18e127]
          - paragraph [ref=f18e128]: "The same ranking and the same score, with one extra rule: no single SKU may take more than the concentration cap — 40% of the budget by default."
      - generic [ref=f18e130]:
        - heading "The limitation, stated plainly" [level=3] [ref=f18e131]
        - paragraph [ref=f18e132]: "The conservative scenario is a uniform downside shock: price and sell-through fall for every SKU at once. Because every SKU is stressed equally, it cannot demonstrate the benefit of spreading a budget — a diversified plan can even score worse under it than a concentrated one, while still being more resilient in practice to a product-specific failure such as a supplier default, a stock-out or a listing suspension. Treat the scenario as a stress test of price and sell-through, not as proof of anything about diversification."
    - generic [ref=f18e134]:
      - generic [ref=f18e135]:
        - paragraph [ref=f18e136]: What this is not
        - heading "Limits worth reading before you trust a number." [level=2] [ref=f18e137]
      - list [ref=f18e138]:
        - listitem [ref=f18e139]:
          - text: "01"
          - heading "Not a forecast" [level=3] [ref=f18e140]
          - paragraph [ref=f18e141]: No page estimates future demand, and no model is trained on anything. The expected figures in the Budget Lab rest on the sell-through and salvage values in its own controls, which are assumptions you can see and change.
        - listitem [ref=f18e142]:
          - text: "02"
          - heading "Not connected to any marketplace" [level=3] [ref=f18e143]
          - paragraph [ref=f18e144]: No seller account, no credentials, and no change to an order, a price or a listing. Nothing you see here was read from a live seller account.
        - listitem [ref=f18e145]:
          - text: "03"
          - heading "Not tax advice" [level=3] [ref=f18e146]
          - paragraph [ref=f18e147]: The GST treatment is a simplification for comparing one SKU with another, not a filing position. Overheads — rent, salaries, software, your own time — and income tax sit outside contribution and are never modelled.
        - listitem [ref=f18e148]:
          - text: "04"
          - heading "No live scraping" [level=3] [ref=f18e149]
          - paragraph [ref=f18e150]: No marketplace page or API is read, by this tool or on its behalf. The only way data enters is a file you choose from your own machine, and the fee and GST values that ship with it are illustrative demo assumptions.
        - listitem [ref=f18e151]:
          - text: "05"
          - heading "No automated repricing" [level=3] [ref=f18e152]
          - paragraph [ref=f18e153]: Nothing here writes a price anywhere. A break-even figure is a floor to compare a price against, never an instruction to charge it, and no listing is ever edited.
        - listitem [ref=f18e154]:
          - text: "06"
          - heading "The sample data is synthetic" [level=3] [ref=f18e155]
          - paragraph [ref=f18e156]: The built-in sample is illustrative and generated for demonstration. Imported data must be your own or owner-authorised, and a sell-through value you type is an assumption, not a measurement of how anything sells.
