  - main [ref=f18e25]:
    - generic [ref=f18e27]:
      - generic [ref=f18e28]:
        - paragraph [ref=f18e29]: Decision support for resellers
        - heading "Know which SKU actually makes money." [level=1] [ref=f18e30]
        - paragraph [ref=f18e31]: Import your own product and transaction CSVs and ArbitrageIQ works out what each SKU really contributes after marketplace fees, GST on those fees, shipping, returns and ad spend — then compares two transparent rules of thumb for spending an inventory budget.
        - generic [ref=f18e32]:
          - link "Open the workspace" [ref=f18e33] [cursor=pointer]:
